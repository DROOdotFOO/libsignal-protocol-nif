name: Gleam Wrapper CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'wrappers/gleam/**'
      - 'c_src/**'
      - 'src/**'
      - '.github/workflows/gleam-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'wrappers/gleam/**'
      - 'c_src/**'
      - 'src/**'
      - '.github/workflows/gleam-ci.yml'

jobs:
  test-gleam-wrapper:
    name: Test Gleam wrapper
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Erlang/OTP
      uses: erlef/setup-beam@v1.24.0
      with:
        otp-version: '26.2'
        rebar3-version: '3.22.1'
        install-hex: true
        install-rebar: true
        gleam-version: '1.16.0'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev cmake build-essential pkg-config

    - name: Build main NIF
      run: |
        rebar3 compile
        cd c_src
        cmake . -DCMAKE_BUILD_TYPE=Release
        make
        cd ..

    # Same shim as the Elixir wrapper job in ci.yml: gleam.toml requires the
    # NIF package so consumers resolve it, but an in-repo run cannot until
    # that version is published. libsignal_protocol_gleam_ffi:test_setup/0
    # puts the working tree's NIF ahead of any dependency copy, so the tests
    # exercise this checkout either way. Disables itself once published.
    - name: Drop unpublished NIF requirement (pre-release only)
      run: |
        version=$(tr -d '[:space:]' < VERSION)
        url="https://hex.pm/api/packages/libsignal_protocol_nif/releases/$version"
        status=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)
        case "$status" in
          200) echo "libsignal_protocol_nif $version is published; using the real requirement." ;;
          404) echo "libsignal_protocol_nif $version not yet on Hex; dropping the requirement."
               sed -i '/libsignal_protocol_nif/d' wrappers/gleam/gleam.toml ;;
          *)   echo "Hex returned $status for $url -- refusing to guess."; exit 1 ;;
        esac

    - name: Test Gleam wrapper
      run: |
        cd wrappers/gleam
        mkdir -p priv
        cp -f ../../priv/*.so priv/
        gleam deps download
        export ERL_LIBS="../../_build/default/lib:$ERL_LIBS"
        gleam test
