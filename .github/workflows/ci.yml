name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always
  MIX_ENV: test

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest]
        otp: ['24.3', '25.3', '26.2']
        # Temporarily disable macOS due to setup-beam issues
        # TODO: Re-enable once setup-beam supports macOS properly
        # include:
        #   - os: macos-latest
        #     otp: '26.2'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Erlang/OTP
      uses: erlef/setup-beam@v1.24.0
      with:
        otp-version: ${{ matrix.otp }}
        rebar3-version: '3.22.1'
        install-hex: true
        install-rebar: true
      # Add timeout and retry for macOS
      timeout-minutes: 10
      continue-on-error: ${{ matrix.os == 'macos-latest' }}
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev cmake build-essential pkg-config
        # Verify installations
        cmake --version
        pkg-config --exists libsodium && echo "libsodium found" || echo "libsodium not found"
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install libsodium cmake pkg-config
        # Verify installations
        cmake --version
        pkg-config --exists libsodium && echo "libsodium found" || echo "libsodium not found"
    
    - name: Cache rebar3 dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/rebar3
          _build
        key: rebar3-${{ matrix.os }}-${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
        restore-keys: |
          rebar3-${{ matrix.os }}-${{ matrix.otp }}-
    
    - name: Clean previous builds
      run: |
        make clean
        rm -rf _build
    
    - name: Build C components first
      run: |
        echo "Building C components..."
        cd c_src
        cmake . -DCMAKE_BUILD_TYPE=Release
        make
        cd ..
        ls -la priv/
    
    - name: Compile Erlang components
      run: |
        echo "Compiling Erlang components..."
        rebar3 compile
    
    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        make test-unit
    
    # Add retry mechanism for macOS if tests fail
    - name: Retry unit tests on macOS (if failed)
      if: failure() && runner.os == 'macOS'
      run: |
        echo "Retrying unit tests on macOS..."
        sleep 5
        make test-unit
      continue-on-error: true
    
  test-wrappers:
    name: Test ${{ matrix.wrapper }} wrapper
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wrapper: [elixir]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Erlang/OTP and Elixir
      uses: erlef/setup-beam@v1.24.0
      with:
        otp-version: '26.2'
        elixir-version: '1.16.3'
        rebar3-version: '3.22.1'
        install-hex: true
        install-rebar: true
    

    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev cmake build-essential pkg-config
        # Verify installations
        cmake --version
        pkg-config --exists libsodium && echo "libsodium found" || echo "libsodium not found"
    
    - name: Build main NIF
      run: |
        echo "Building main NIF..."
        # First compile Erlang components to ensure NIF is built
        rebar3 compile
        # Then build C components
        cd c_src
        cmake . -DCMAKE_BUILD_TYPE=Release
        make
        cd ..
        ls -la priv/
        echo "NIF files built:"
        find priv/ -name "*.so" -o -name "*.dll" -o -name "*.dylib" | head -10
        echo "Erlang beam files:"
        find _build/ -name "*.beam" | grep libsignal | head -10
    
    # The wrapper declares the NIF as a Hex dependency so consumers resolve
    # it; an in-repo run cannot resolve a version that is not published yet.
    # Drop the requirement for this run only. The tests are unaffected:
    # test_helper.exs puts the working tree's NIF ahead of any dependency
    # copy on the code path. This step is a no-op once the version is on
    # Hex; consumer-side resolution is covered by the consumer-smoke job.
    - name: Drop unpublished NIF requirement (pre-release only)
      if: matrix.wrapper == 'elixir'
      run: |
        version=$(tr -d '[:space:]' < VERSION)
        url="https://hex.pm/api/packages/libsignal_protocol_nif/releases/$version"
        status=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)
        case "$status" in
          200) echo "libsignal_protocol_nif $version is published; using the real requirement." ;;
          404) echo "libsignal_protocol_nif $version not yet on Hex; dropping the requirement."
               sed -i '/libsignal_protocol_nif/d' wrappers/elixir/mix.exs ;;
          *)   echo "Hex returned $status for $url -- refusing to guess."; exit 1 ;;
        esac

    - name: Test Elixir wrapper
      if: matrix.wrapper == 'elixir'
      run: |
        cd wrappers/elixir
        mkdir -p priv
        cp -f ../../priv/*.so priv/
        mix deps.get
        mix compile
        export ERL_LIBS="../../_build/default/lib:$ERL_LIBS"
        mix test --trace
    


  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - uses: actions/checkout@v5
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Erlang/OTP
      uses: erlef/setup-beam@v1.24.0
      with:
        otp-version: '26.2'
        rebar3-version: '3.22.1'
        install-hex: true
        install-rebar: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev cmake build-essential pkg-config
    
    - name: Build C components for linting
      run: |
        cd c_src
        cmake . -DCMAKE_BUILD_TYPE=Release
        make
        cd ..
    
    - name: Compile Erlang for linting
      run: rebar3 compile
    
    - name: Check formatting
      run: rebar3 format --verify
    
    - name: Run Dialyzer
      run: rebar3 dialyzer || echo "Dialyzer warnings detected but not failing build"

  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: [test, test-wrappers, lint]  # Removed security from critical path
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Erlang/OTP and Elixir
      uses: erlef/setup-beam@v1.24.0
      with:
        otp-version: '26.2'
        elixir-version: '1.16.3'
        rebar3-version: '3.22.1'
        gleam-version: '1.16.0'
        install-hex: true
        install-rebar: true
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev cmake build-essential pkg-config
    
    - name: Build C components
      run: |
        cd c_src
        cmake . -DCMAKE_BUILD_TYPE=Release
        make
        cd ..
    
    - name: Compile Erlang
      run: rebar3 compile
    
    - name: Publish Erlang package
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: rebar3 hex publish --yes
    
    - name: Publish Elixir package
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: |
        cd wrappers/elixir
        mix deps.get
        mix hex.publish --yes

    - name: Publish Gleam package
      env:
        HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: |
        cd wrappers/gleam
        gleam publish --yes

  consumer-smoke:
    name: Install from Hex as a consumer
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'release' && github.event.action == 'published'

    # The wrapper jobs test the code in the repo: their test hooks put the
    # working tree's NIF ahead of any dependency copy, and pre-release they
    # drop the dependency requirement. So neither catches a wrapper that
    # fails to declare its NIF dependency, or declares one that does not
    # resolve -- a consumer would hit UndefinedFunctionError at the first
    # call. This job is that check: a scratch project depending only on what
    # is on Hex, with no repo checkout on the code path.
    steps:
    - name: Setup Erlang/OTP and Elixir
      uses: erlef/setup-beam@v1.24.0
      with:
        otp-version: '26.2'
        elixir-version: '1.16.3'
        rebar3-version: '3.22.1'
        gleam-version: '1.16.0'
        install-hex: true
        install-rebar: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev cmake build-essential pkg-config

    - name: Resolve and exercise the published Elixir package
      run: |
        version="${GITHUB_REF_NAME#v}"
        mkdir -p /tmp/consumer/lib
        cd /tmp/consumer
        cat > mix.exs <<EOF
        defmodule Consumer.MixProject do
          use Mix.Project
          def project do
            [app: :consumer, version: "0.0.1", elixir: "~> 1.16", deps: deps()]
          end
          def application, do: [extra_applications: [:logger]]
          # Only the published wrapper. It must pull the NIF in itself.
          defp deps, do: [{:libsignal_protocol, "~> ${version%.*}"}]
        end
        EOF
        mix deps.get
        mix deps.compile
        # A real call: proves the dependency resolved, the NIF was downloaded
        # or built, and it loaded from the dependency's own priv dir.
        cat > smoke.exs <<'EOF'
        {:ok, {pub, priv}} = SignalProtocol.generate_identity_key_pair()
        32 = byte_size(pub)
        64 = byte_size(priv)
        {:ok, {_id, spk_pub, _spk_priv, sig}} = SignalProtocol.generate_signed_pre_key(priv, 1)
        :ok = :signal_nif.verify_signature(pub, spk_pub, sig)
        IO.puts("consumer smoke ok")
        EOF
        mix run smoke.exs

    - name: Resolve and exercise the published Gleam package
      run: |
        version="${GITHUB_REF_NAME#v}"
        mkdir -p /tmp/gleam-consumer/src
        cd /tmp/gleam-consumer
        cat > gleam.toml <<EOF
        name = "consumer"
        version = "0.0.0"
        [dependencies]
        libsignal_protocol_gleam = "$version"
        EOF
        cat > src/consumer.gleam <<'EOF'
        import signal_protocol

        pub fn main() {
          let assert Ok(identity) = signal_protocol.generate_identity_key_pair()
          let assert Ok(_) =
            signal_protocol.generate_signed_pre_key(identity.private_key, 1)
          Nil
        }
        EOF
        gleam run

  docker:
    name: Build and test Docker images
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Install system dependencies for Docker build
      run: |
        sudo apt-get update
        sudo apt-get install -y libsodium-dev cmake build-essential pkg-config
    
    - name: Build Docker images
      run: |
        echo "Building Docker images..."
        # Build images step by step with better error handling
        docker build --target base -t libsignal-protocol-nif:base -f docker/Dockerfile . || {
          echo "Base image build failed, checking Dockerfile..."
          head -20 docker/Dockerfile
          exit 1
        }
        docker build --target erlang-build -t libsignal-protocol-nif:erlang -f docker/Dockerfile . || {
          echo "Erlang build failed, checking logs..."
          docker logs $(docker ps -lq) || true
          exit 1
        }
        docker build --target production -t libsignal-protocol-nif:latest -f docker/Dockerfile . || {
          echo "Production build failed"
          exit 1
        }
    
    - name: Test Docker images
      run: |
        echo "Testing Docker images..."
        # Test basic functionality
        docker run --rm libsignal-protocol-nif:latest erl -noshell -eval "halt()." || {
          echo "Docker image test failed"
          exit 1
        }
      continue-on-error: true
    
    - name: Login to Docker Hub
      if: github.event_name == 'release'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
    
    - name: Push Docker images
      if: github.event_name == 'release'
      run: |
        docker tag libsignal-protocol-nif:latest ${{ secrets.DOCKER_USERNAME }}/libsignal-protocol-nif:latest
        docker tag libsignal-protocol-nif:latest ${{ secrets.DOCKER_USERNAME }}/libsignal-protocol-nif:${{ github.event.release.tag_name }}
        docker push ${{ secrets.DOCKER_USERNAME }}/libsignal-protocol-nif:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/libsignal-protocol-nif:${{ github.event.release.tag_name }}