# Invoked from the repo root via `make docker-test` / `make docker-perf` as
# `docker compose -f docker/docker-compose.yml ...`. Compose resolves paths
# relative to this file, so build contexts and bind mounts point at `..`.
services:
  # Development environment
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    volumes:
      - ..:/app
      - /app/c_src/build
      - /app/priv
      - /app/tmp
    environment:
      - MIX_ENV=dev
    command: sh -c "make build && make test && tail -f /dev/null"

  # Erlang testing
  erlang-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: erlang-build
    volumes:
      - ../tmp:/app/tmp
    environment:
      - CT_OPTS=--logdir=/app/tmp/ct_logs

  # Elixir testing
  elixir-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: elixir-build
    volumes:
      - ../tmp:/app/tmp
    environment:
      - MIX_ENV=test

  # Gleam testing
  gleam-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gleam-build
    volumes:
      - ../tmp:/app/tmp

  # Production build
  production:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    ports:
      - "8080:8080"
    environment:
      - NODE_NAME=signal@localhost
    restart: unless-stopped

  # Performance testing
  perf-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    volumes:
      - ..:/app
    command: sh -c "make perf-test"
    environment:
      - PERF_ITERATIONS=10000
      - PERF_CONCURRENT=100

networks:
  default:
    name: signal-network 